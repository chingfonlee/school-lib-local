name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create config from example
        run: |
          cp config.example.yaml config.yaml
          python -c "import pathlib, secrets; from setup_first_run import apply_setup_values; apply_setup_values(pathlib.Path('config.yaml'), password='ci-test-password', secret_key=secrets.token_hex(32))"

      - name: Syntax check
        run: python -m compileall -q app run_server.py setup_first_run.py

      - name: Lint check
        run: python -m ruff check app tests run_server.py setup_first_run.py

      - name: Type check
        run: python -m mypy app/logging_config.py app/database.py app/main.py app/config.py app/auth.py app/routers/backup.py app/routers/projects.py app/services/isbn_service.py app/services/completeness_service.py app/services/match_service.py app/services/validation_service.py run_server.py

      - name: Run tests
        run: python -m pytest -q
