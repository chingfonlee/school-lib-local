<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>比對結果 — 圖書採購系統</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <span class="nav-title">圖書採購系統</span>
    <div class="nav-steps">
      <a href="/projects.html"><span class="step-num">1</span>採購專案</a>
      <a href="/import.html"><span class="step-num">2</span>匯入</a>
      <a href="/match.html" class="active"><span class="step-num">3</span>比對結果</a>
      <a href="/selection.html"><span class="step-num">4</span>選書</a>
      <a href="/export-check.html"><span class="step-num">5</span>匯出前檢查</a>
      <a href="/export.html"><span class="step-num">6</span>匯出</a>
    </div>
    <a href="/holdings.html" class="nav-tool">館藏查詢</a>
    <a href="/admin-templates.html" class="nav-tool">範本管理</a>
    <div class="nav-right"><span id="user-name"></span> <a href="#" onclick="logout()">登出</a></div>
  </div>
</nav>
<div class="page container">
  <div class="section-header">
    <div><h1>比對結果</h1><p class="subtitle" id="project-label">目前專案：載入中...</p></div>
    <div class="right" style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-secondary" onclick="runMatch(this)">重新比對</button>
      <a href="/selection.html" class="btn btn-primary">前往選書 →</a>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="filter-bar">
    <label>書商：</label>
    <select id="filter-vendor" onchange="onVendorFilterChange()">
      <option value="">全部書商</option>
    </select>
    <label>比對狀態：</label>
    <select id="filter-match" onchange="onFilterChange()">
      <option value="">全部</option>
      <option value="available">可採購</option>
      <option value="already_owned">已館藏</option>
      <option value="same_title_different_isbn">疑似同名館藏</option>
      <option value="other_project_selected">他案已選</option>
      <option value="missing_isbn">缺 ISBN（含弱比對）</option>
      <option value="invalid_isbn">無效 ISBN（含弱比對）</option>
    </select>
    <label>完整度：</label>
    <select id="filter-comp" onchange="onFilterChange()">
      <option value="">全部</option>
      <option value="export_ready">可匯出</option>
      <option value="needs_review">需補資料</option>
      <option value="missing_required">缺必填</option>
    </select>
    <span id="result-count" style="font-size:13px;color:#666;margin-left:8px"></span>
  </div>

  <div class="card" style="padding:0">
    <div class="table-wrap">
      <table id="book-table">
        <thead>
          <tr>
            <th>書商</th><th>書名</th><th>作者</th><th>出版社</th><th>ISBN</th>
            <th>獲獎項目</th><th>比對狀態</th><th>完整度</th>
          </tr>
        </thead>
        <tbody id="book-body"></tbody>
      </table>
    </div>
  </div>

  <div id="pagination" style="display:none;margin-top:16px;justify-content:center;align-items:center;gap:8px">
    <button class="btn btn-secondary btn-sm" id="page-prev" onclick="goPage(-1)">上一頁</button>
    <span id="page-info" style="font-size:13px;color:#666"></span>
    <button class="btn btn-secondary btn-sm" id="page-next" onclick="goPage(1)">下一頁</button>
  </div>
</div>
<div id="toast"></div>
<script src="/js/common.js"></script>
<script>
const PAGE_SIZE = 100;
let pid = null;
let currentPage = 1;
let totalPages = 0;

requireAuth().then(async () => {
  pid = requireProject();
  if (!pid) return;
  let proj;
  try {
    proj = await api(`/api/projects/${pid}`);
  } catch {
    clearProject();
    pid = null;
    requireProject();
    return;
  }
  document.getElementById('project-label').textContent = `目前專案：${proj.name}`;
  await loadVendors();
  await Promise.all([loadStats(), loadBooks()]);
});

async function loadVendors() {
  try {
    const vendors = await api('/api/imports/vendors');
    const sel = document.getElementById('filter-vendor');
    const cur = sel.value;
    sel.innerHTML = '<option value="">全部書商</option>' +
      (vendors || []).map(v =>
        `<option value="${esc(v.vendor_name)}">${esc(v.vendor_name)}（${Number(v.book_count) || 0}）</option>`
      ).join('');
    if (cur) sel.value = cur;
  } catch {}
}

async function onVendorFilterChange() {
  currentPage = 1;
  await Promise.all([loadStats(), loadBooks()]);
}

function onFilterChange() {
  currentPage = 1;
  loadBooks();
}

function updatePagination(total) {
  const bar = document.getElementById('pagination');
  if (!total || totalPages <= 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  document.getElementById('page-info').textContent = `第 ${currentPage} / ${totalPages} 頁，共 ${total} 筆`;
  document.getElementById('page-prev').disabled = currentPage <= 1;
  document.getElementById('page-next').disabled = currentPage >= totalPages;
}

function goPage(delta) {
  const next = currentPage + delta;
  if (next < 1 || next > totalPages) return;
  currentPage = next;
  loadBooks();
}

async function loadStats() {
  try {
    const vn = document.getElementById('filter-vendor').value;
    let url = `/api/books/stats?project_id=${pid}`;
    if (vn) url += `&vendor_name=${encodeURIComponent(vn)}`;
    const s = await api(url);
    const ms = s.match_status || {};
    const cs = s.completeness_status || {};
    document.getElementById('stats-row').innerHTML = `
      <div class="stat-card green"><div class="num">${ms.available||0}</div><div class="label">可採購</div></div>
      <div class="stat-card gray"><div class="num">${ms.already_owned||0}</div><div class="label">已館藏</div></div>
      <div class="stat-card yellow"><div class="num">${s.same_title_different_isbn_count||0}</div><div class="label">疑似同名館藏</div></div>
      <div class="stat-card purple"><div class="num">${s.other_project_duplicate_count||0}</div><div class="label">他案已選</div></div>
      <div class="stat-card gray"><div class="num">${s.ignored_missing_isbn||0}</div><div class="label">已忽略缺ISBN</div></div>
      <div class="stat-card green"><div class="num">${cs.export_ready||0}</div><div class="label">可匯出</div></div>
      <div class="stat-card yellow"><div class="num">${cs.needs_review||0}</div><div class="label">需補資料</div></div>
      <div class="stat-card red"><div class="num">${cs.missing_required||0}</div><div class="label">缺必填</div></div>
    `;
  } catch (e) {
    document.getElementById('stats-row').innerHTML = `<div class="alert alert-error">無法載入統計：${esc(e.message)}</div>`;
  }
}

function renderMatchStatusCell(b) {
  const status = b.match_status || 'unknown';
  const copies = Number(b.holding_copies) || 0;
  let html = status === 'already_owned' && copies > 0
    ? `<span class="badge badge-already_owned">已館藏（${copies}冊）</span>`
    : badge(status);

  if (b.similar_holding) {
    const sh = b.similar_holding;
    const parts = [esc(sh.title || '—')];
    if (sh.author) parts.push(esc(sh.author));
    const isbnText = sh.isbn ? `（ISBN: ${esc(sh.isbn)}）` : '';
    html += `<div class="dup-note dup-note-similar"><span class="badge badge-similar">疑似同名館藏</span> ${parts.join(' / ')}${isbnText}</div>`;
  }

  if (Array.isArray(b.other_project_selections) && b.other_project_selections.length > 0) {
    const exported = b.other_project_selections.filter(p => p.has_exported);
    const selecting = b.other_project_selections.filter(p => !p.has_exported);
    if (exported.length > 0) {
      const names = exported.map(p => esc(p.project_name || '')).filter(Boolean).join('、');
      html += `<div class="dup-note dup-note-other-project"><span class="badge badge-other-exported">他案已匯出</span> ${names}</div>`;
    }
    if (selecting.length > 0) {
      const names = selecting.map(p => esc(p.project_name || '')).filter(Boolean).join('、');
      html += `<div class="dup-note dup-note-other-project"><span class="badge badge-other-project">他案選書中</span> ${names}</div>`;
    }
  }

  return html;
}

async function loadBooks() {
  if (!pid) return;
  const tbody = document.getElementById('book-body');
  tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:40px">載入中...</td></tr>';
  const vn = document.getElementById('filter-vendor').value;
  const ms = document.getElementById('filter-match').value;
  const cs = document.getElementById('filter-comp').value;
  let url = `/api/books/matches?project_id=${pid}&page=${currentPage}&page_size=${PAGE_SIZE}&include_offers=false`;
  if (vn) url += `&vendor_name=${encodeURIComponent(vn)}`;
  if (ms) url += `&match_status=${encodeURIComponent(ms)}`;
  if (cs) url += `&completeness_status=${encodeURIComponent(cs)}`;
  let data;
  try {
    data = await api(url);
  } catch (e) {
    totalPages = 0;
    updatePagination(0);
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#c0392b;padding:40px">載入失敗：${esc(e.message)}</td></tr>`;
    return;
  }
  const books = Array.isArray(data) ? data : (data.items || []);
  const total = Array.isArray(data) ? books.length : (Number(data.total) || 0);
  totalPages = Array.isArray(data) ? (total > 0 ? 1 : 0) : (Number(data.total_pages) || 0);
  document.getElementById('result-count').textContent = `共 ${total} 筆`;
  updatePagination(total);
  if (!books.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:40px">無資料</td></tr>';
    return;
  }
  tbody.innerHTML = books.map(b => {
    const overrides = safeParseJson(b.user_overrides, {});
    const vendorName = b.vendor_name || '未指定書商';
    const title = overrides.title || b.title || '—';
    const author = overrides.author || b.author || '—';
    const publisher = overrides.publisher || b.publisher || '—';
    const isbn = b.isbn_normalized || b.isbn || '—';
    const award = overrides.award_item || b.award_item || '—';
    return `<tr>
      <td><span class="badge badge-vendor">${esc(vendorName)}</span></td>
      <td>${esc(title)}</td>
      <td>${esc(author)}</td>
      <td>${esc(publisher)}</td>
      <td style="font-size:12px">${esc(isbn)}</td>
      <td style="font-size:12px;max-width:160px;white-space:normal">${esc(award)}</td>
      <td>${renderMatchStatusCell(b)}</td>
      <td>${badge(b.completeness_status || 'unknown')}</td>
    </tr>`;
  }).join('');
}

async function runMatch(btn) {
  if (!pid) return;
  if (btn) {
    btn.disabled = true;
    btn.textContent = '比對中...';
  }
  try {
    const stats = await api('/api/books/run-match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_id: pid })
    });
    showToast(`比對完成：可採購 ${stats.available||0} 本、已館藏 ${stats.already_owned||0} 本`);
    currentPage = 1;
    await Promise.all([loadStats(), loadBooks()]);
  } catch (e) {
    showToast('比對失敗：' + e.message);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = '重新比對';
    }
  }
}
</script>
</body>
</html>
