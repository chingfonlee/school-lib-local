<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匯出 — 圖書採購系統</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
  <div class="nav-inner">
    <span class="nav-title">圖書採購系統</span>
    <div class="nav-steps">
      <a href="/projects.html"><span class="step-num">1</span>採購專案</a>
      <a href="/import.html"><span class="step-num">2</span>匯入</a>
      <a href="/match.html"><span class="step-num">3</span>比對結果</a>
      <a href="/selection.html"><span class="step-num">4</span>選書</a>
      <a href="/export-check.html"><span class="step-num">5</span>匯出前檢查</a>
      <a href="/export.html" class="active"><span class="step-num">6</span>匯出</a>
    </div>
    <a href="/holdings.html" class="nav-tool">館藏查詢</a>
    <a href="/admin-templates.html" class="nav-tool">範本管理</a>
    <div class="nav-right"><span id="user-name"></span> <a href="#" onclick="logout()">登出</a></div>
  </div>
</nav>
<div class="page container">
  <h1>產生採購書單</h1>
  <p class="subtitle" id="project-label">目前專案：載入中...</p>

  <div class="card">
    <h2>匯出設定</h2>
    <div id="generic-template-note" class="alert alert-info" style="display:none;margin-bottom:12px">
      本專案使用內建「通用採購清單（免範本）」格式匯出，免上傳範本即可直接產生 Excel。
    </div>
    <div class="form-row">
      <div class="form-group" id="school-name-group">
        <label id="school-name-label">學校名稱 <span style="color:#c0392b">*</span></label>
        <input type="text" id="school-name" placeholder="例：○○國小">
      </div>
      <div class="form-group" id="budget-group">
        <label>核定金額（選填）</label>
        <input type="number" id="budget" placeholder="例：45000">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>定價欄顯示</label>
        <select id="price-field" onchange="loadPreview()">
          <option value="purchase_price">採購單價</option>
          <option value="list_price">定價</option>
        </select>
      </div>
      <div class="form-group">
        <label>小計計算方式</label>
        <select id="subtotal-mode" onchange="loadPreview()">
          <option value="quantity_times_purchase_price">數量 × 採購單價</option>
          <option value="quantity_times_list_price">數量 × 定價</option>
        </select>
      </div>
    </div>
    <div id="export-alert" class="alert alert-warn" style="display:none;margin-bottom:12px"></div>
    <button class="btn btn-primary" id="export-btn" onclick="doExport()">產生 Excel</button>
    <span id="export-status" style="margin-left:12px;font-size:14px;color:#6e6e73"></span>
  </div>

  <div class="card" id="preview-card">
    <h2>選書預覽（可匯出書目）</h2>
    <div id="preview-source-note" class="alert alert-info" style="display:none;margin-bottom:12px">
      部分書目的書商書單來源已清除，書目資料來自保存的採購紀錄快照，不影響匯出結果。
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>書名</th><th>作者</th><th>ISBN</th><th>定價</th><th>單價</th>
          <th>數量</th><th id="award-col-header">獲獎項目</th><th>完整度</th>
        </tr></thead>
        <tbody id="preview-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>匯出紀錄</h2>
    <div id="job-list"><p style="color:#999">無紀錄</p></div>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid #e5e5ea">
      <h3 style="margin:0 0 8px;font-size:16px">採購完成回流館藏</h3>
      <p style="font-size:13px;color:#6e6e73;margin:0 0 12px">
        採購完成後，可將本案已選購書目一鍵記入學校館藏，避免下一個補助案重複採購（重複操作會自動略過已回流書目）。
      </p>
      <button class="btn btn-secondary" id="commit-holdings-btn" onclick="commitToHoldings()">將本案已採購書目記入館藏</button>
      <div id="commit-holdings-result" style="margin-top:12px"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/js/common.js"></script>
<script>
const LAST_SCHOOL_NAME_KEY = 'last_export_school_name';
let pid = null;
let projectType = null;
let exportTemplateType = null;
let selectedCountForCommit = 0;

requireAuth().then(async () => {
  pid = requireProject();
  if (!pid) return;
  let proj;
  try {
    proj = await api(`/api/projects/${pid}`);
  } catch {
    clearProject();
    pid = null;
    requireProject();
    return;
  }
  document.getElementById('project-label').textContent = `目前專案：${proj.name}`;

  const params = new URLSearchParams(window.location.search);
  const qPf = params.get('price_field');
  const qSm = params.get('subtotal_mode');
  const validPf = ['purchase_price', 'list_price'];
  const validSm = ['quantity_times_purchase_price', 'quantity_times_list_price'];
  document.getElementById('price-field').value = validPf.includes(qPf) ? qPf : proj.price_field;
  document.getElementById('subtotal-mode').value = validSm.includes(qSm) ? qSm : proj.subtotal_mode;

  if (proj.budget_amount != null) {
    document.getElementById('budget').value = proj.budget_amount;
  }
  try {
    const savedSchool = localStorage.getItem(LAST_SCHOOL_NAME_KEY);
    if (savedSchool) document.getElementById('school-name').value = savedSchool;
  } catch {}

  projectType = proj.project_type;
  exportTemplateType = proj.export_template_type || defaultExportTemplateForType(projectType);
  if (exportTemplateType === 'generic_builtin') {
    document.getElementById('generic-template-note').style.display = 'block';
    document.getElementById('school-name-label').innerHTML = '學校名稱 <span style="color:#888;font-size:12px;font-weight:400">（選填）</span>';
    document.getElementById('award-col-header').textContent = '備註';
  } else if (exportTemplateType === 'general_books') {
    document.getElementById('school-name-group').style.display = 'none';
    document.getElementById('budget-group').style.display = 'none';
    document.getElementById('award-col-header').textContent = 'H欄推薦來源';
  } else if (exportTemplateType === 'general_books_jh') {
    document.getElementById('award-col-header').textContent = 'K欄獲獎項目';
  }
  await Promise.all([loadPreview(), loadJobs()]);
});

async function loadPreview() {
  if (!pid) return;
  const pf = document.getElementById('price-field').value;
  const sm = document.getElementById('subtotal-mode').value;
  const tbody = document.getElementById('preview-body');
  const alertEl = document.getElementById('export-alert');
  const exportBtn = document.getElementById('export-btn');
  try {
    const [check, sel] = await Promise.all([
      api(`/api/exports/check?project_id=${pid}&price_field=${encodeURIComponent(pf)}&subtotal_mode=${encodeURIComponent(sm)}`),
      api(`/api/selections/?project_id=${pid}`)
    ]);

    selectedCountForCommit = sel.items.filter(b => b.selected_quantity > 0).length;
    const commitBtn = document.getElementById('commit-holdings-btn');
    if (commitBtn) commitBtn.disabled = selectedCountForCommit === 0;

    const items = sel.items.filter(b => {
      if (!b.selected_quantity) return false;
      const effectiveStatus = b.current_match_status || b.match_status_at_selection || 'available';
      return effectiveStatus !== 'already_owned';
    });
    const hasCleared = sel.items.some(b => !b.vendor_book_still_exists);
    document.getElementById('preview-source-note').style.display = hasCleared ? 'block' : 'none';
    exportBtn.disabled = items.length === 0;

    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;padding:30px">尚無選書</td></tr>';
      alertEl.style.display = 'none';
      return;
    }
    tbody.innerHTML = items.map((b, i) => {
      const ov = safeParseJson(b.user_overrides, {});
      const listPrice = ov.list_price || b.list_price;
      const purchasePrice = ov.purchase_price || b.purchase_price;
      const awardCol = exportTemplateType === 'generic_builtin'
        ? (ov.notes || b.notes || '—')
        : isGeneralBooks(exportTemplateType)
          ? (ov.recommendation_source || b.recommendation_source || '—')
          : (ov.award_item || b.award_item || '—');
      return `<tr>
        <td>${i+1}</td>
        <td>${esc(ov.title || b.title || '—')}</td>
        <td>${esc(ov.author || b.author || '—')}</td>
        <td style="font-size:12px">${esc(b.isbn_normalized || b.isbn || '—')}</td>
        <td>${listPrice ? formatCurrency(listPrice) : '—'}</td>
        <td>${purchasePrice ? formatCurrency(purchasePrice) : '—'}</td>
        <td>${b.selected_quantity}</td>
        <td style="font-size:12px;max-width:140px;white-space:normal">${esc(awardCol)}</td>
        <td>${badge(b.completeness_status || 'unknown')}</td>
      </tr>`;
    }).join('');

    if (check.missing_required > 0) {
      alertEl.style.display = 'block';
      alertEl.textContent =
        `注意：有 ${check.missing_required} 本書缺少必填欄位，匯出時欄位將留空，請確認後再匯出。`;
    } else {
      alertEl.style.display = 'none';
    }
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:#c0392b;padding:30px">載入預覽失敗：${esc(e.message)}</td></tr>`;
  }
}

async function loadJobs() {
  if (!pid) return;
  const el = document.getElementById('job-list');
  try {
    const jobs = await api(`/api/exports/jobs?project_id=${pid}`);
    if (!jobs.length) { el.innerHTML = '<p style="color:#999">無匯出紀錄</p>'; return; }
    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>時間</th><th>校名</th><th>定價設定</th><th>小計設定</th><th>筆數</th><th>總金額</th><th>下載</th></tr></thead>
      <tbody>${jobs.map(j => `
        <tr>
          <td style="white-space:nowrap">${esc(new Date(j.exported_at).toLocaleString('zh-TW'))}</td>
          <td>${esc(j.school_name || '—')}</td>
          <td>${j.price_field === 'purchase_price' ? '採購單價' : '定價'}</td>
          <td>${j.subtotal_mode === 'quantity_times_purchase_price' ? '數量×單價' : '數量×定價'}</td>
          <td>${j.record_count || 0}</td>
          <td>NT$ ${formatCurrency(j.total_amount)}</td>
          <td><a href="/api/exports/download/${j.id}" class="btn btn-secondary btn-sm">下載</a></td>
        </tr>`).join('')}
      </tbody></table></div>`;
  } catch (e) {
    el.innerHTML = `<p style="color:#c0392b">載入匯出紀錄失敗：${esc(e.message)}</p>`;
  }
}

async function doExport() {
  const school = document.getElementById('school-name').value.trim();
  const schoolRequired = exportTemplateType !== 'general_books' && exportTemplateType !== 'generic_builtin';
  if (schoolRequired && !school) { showToast('請填入學校名稱（例：○○國中）'); return; }
  if (school) {
    try { localStorage.setItem(LAST_SCHOOL_NAME_KEY, school); } catch {}
  }
  const budget = document.getElementById('budget').value;
  const btn = document.getElementById('export-btn');
  const status = document.getElementById('export-status');
  btn.disabled = true;
  status.textContent = '匯出中...';
  try {
    const res = await api('/api/exports/local-culture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        project_id: pid,
        school_name: school,
        approved_budget: budget ? parseFloat(budget) : null,
        price_field: document.getElementById('price-field').value,
        subtotal_mode: document.getElementById('subtotal-mode').value,
      })
    });
    status.textContent = '';
    showToast('匯出完成！');
    await loadJobs();
    window.location.href = `/api/exports/download/${res.job_id}`;
  } catch (e) {
    status.textContent = '';
    showToast('匯出失敗：' + e.message, 5000);
  } finally {
    btn.disabled = false;
  }
}

async function commitToHoldings() {
  if (!pid) return;
  const countHint = selectedCountForCommit > 0 ? `本案預計回流 ${selectedCountForCommit} 筆已選購書目，` : '';
  if (!confirm(`${countHint}記入學校館藏後可避免下一個補助案重複採購，且重複操作會自動略過已回流書目。確定要執行嗎？`)) {
    return;
  }
  const btn = document.getElementById('commit-holdings-btn');
  const resultEl = document.getElementById('commit-holdings-result');
  btn.disabled = true;
  resultEl.innerHTML = '<div class="alert alert-info"><span class="spinner"></span> 正在將已採購書目記入學校館藏...</div>';
  try {
    const res = await api('/api/exports/commit-to-holdings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_id: pid }),
    });
    const inserted = Number(res.inserted_count) || 0;
    const skipped = Number(res.skipped_count) || 0;
    let matchNote = '';
    if (res.match_rerun_error) {
      matchNote = '<br><span class="text-warning">⚠ 已寫入館藏，但自動比對失敗，請到比對頁手動重新比對。</span>';
    } else if (res.match_rerun) {
      matchNote = '<br>已自動重新執行全校共用書商書單比對。';
    }
    if (inserted > 0) {
      const skippedText = skipped > 0 ? `，略過已回流 ${skipped} 筆` : '';
      resultEl.innerHTML = `<div class="alert alert-success">✓ 已將「${esc(res.project_name)}」新增 <strong>${inserted}</strong> 筆至學校館藏${skippedText}。${matchNote}</div>`;
      showToast(`已新增 ${inserted} 筆至學校館藏`);
    } else {
      resultEl.innerHTML = `<div class="alert alert-info">本案 ${skipped} 筆已選購書目先前皆已回流至學校館藏，未重複寫入。</div>`;
      showToast('本案書目皆已回流至館藏');
    }
    await loadPreview();
  } catch (e) {
    resultEl.innerHTML = `<div class="alert alert-error">記入館藏失敗：${esc(e.message)}</div>`;
    showToast('記入館藏失敗：' + e.message, 4000);
  } finally {
    btn.disabled = selectedCountForCommit === 0;
  }
}
</script>
</body>
</html>
