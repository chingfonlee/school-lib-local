    <button type="button" class="preset-chip" id="preset-unselected" onclick="togglePreset('unselected')">只看未選書目</button>
    <button type="button" class="preset-chip" id="preset-selected" onclick="togglePreset('selected')">只看已選清單</button>

    <div class="filter-field">

        <option value="other_project_selected">他案已選</option>

    </div>
    <div class="filter-field">
      <label>完整度：</label>
      <select id="filter-comp" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="export_ready">可匯出</option>
        <option value="needs_review">需補資料</option>
        <option value="missing_required">缺必填</option>
      </select>
    </div>
    <div class="filter-field">
      <label>出版年份：</label>
      <select id="filter-pub-year" onchange="applyFilter()">

        <option value="1">近 1 年</option>
        <option value="2">近 2 年</option>

        <option value="5">近 5 年</option>
      </select>
    </div>
    <div class="filter-field" id="field-book-type" style="display:none">
      <label>類型：</label>
      <select id="filter-book-type" onchange="applyFilter()"><option value="">全部</option></select>
    </div>
    <div class="filter-field">
      <label>年齡：</label>
      <select id="filter-age" onchange="applyFilter()"><option value="">全部</option></select>
    </div>
    <div class="filter-field" id="field-category" style="display:none">
      <label>分類：</label>
      <select id="filter-category" onchange="applyFilter()"><option value="">全部</option></select>
    </div>
    <div class="filter-field" id="field-policy-topic" style="display:none">
      <label>議題：</label>
      <select id="filter-policy-topic" onchange="applyFilter()"><option value="">全部</option></select>
    </div>
    <div class="filter-field" id="field-purchase-category" style="display:none">
      <label>採購類別：</label>
      <select id="filter-purchase-category" onchange="applyFilter()">
        <option value="">全部</option>
        <option value="必選">必選</option>
        <option value="推薦">推薦</option>

    <div class="filter-field" id="field-recommendation-source" style="display:none">

      <span style="color:#aaa">~</span>
      <input type="number" id="filter-max-price" placeholder="最高價" oninput="scheduleFilter()" style="width:72px">

    <input type="text" id="filter-text" placeholder="關鍵字搜尋..." style="width:160px">
    <select id="filter-sort" onchange="applyFilter()">

      <option value="pub_desc">出版最新優先（新→舊）</option>
      <option value="pub_asc">出版年份（舊→新）</option>
      <option value="available_first">可採購優先</option>
      <option value="completeness_first">完整度優先</option>
      <option value="price_asc">價格低→高</option>
      <option value="price_desc">價格高→低</option>

    <button class="btn btn-secondary btn-sm" onclick="resetFilters()">重設篩選</button>
    <button class="btn btn-secondary btn-sm" id="btn-add-page" onclick="addCurrentPage()">加入本頁</button>
    <span id="result-count" style="font-size:13px;color:#666"></span>
  </div>

  <div id="selected-only-banner" class="selected-only-banner" style="display:none">

      來源書單已清除 — 以下為保存的採購紀錄快照
    </h3>

  </div>

<div id="import-projects-modal" class="modal-backdrop" style="display:none" onclick="if (event.target === this) closeImportProjectsModal()">
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="import-modal-title">
    <div class="modal-header">
      <h3 id="import-modal-title">從其他專案匯入選書</h3>
      <button type="button" class="btn btn-secondary btn-sm" onclick="closeImportProjectsModal()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:#555;margin-bottom:8px">
        勾選要匯整的來源專案（例如班級推薦或師生清單），系統將以每本數量 1 複製快照並自動去除重複書目，同時依目前專案類型重算資料完整度。
      </p>
      <div id="import-projects-list" class="modal-project-list">載入專案中...</div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px;cursor:pointer">
        <input type="checkbox" id="import-skip-owned" checked>
        <span>自動略過已館藏書目（建議維持勾選）</span>
      </label>

    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary btn-sm" onclick="closeImportProjectsModal()">關閉</button>
      <button type="button" class="btn btn-primary btn-sm" id="btn-confirm-import-projects" onclick="submitImportFromProjects(this)">開始匯入</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/common.js"></script>
<script>
let pid = null;
let projectType = null;
let projectBudget = null;
let projectSubtotalMode = 'quantity_times_purchase_price';
let allBooks = [];
let selMap = {};
let selIdMap = {};
let currentSelectionItems = [];
const PAGE_SIZE = 50;
let currentPage = 1;
let filteredBooks = [];
let filterDebounceTimer = null;
let isComposing = false;
let filtersRestored = false;

const VIEW_MODE_KEY = 'selection_view_mode';
const LOCKED_CTA_TITLE = '已加入選書，如需調整數量或移除請至「5 匯出前檢查」';
let viewMode = (function loadViewMode() {
  try { return localStorage.getItem(VIEW_MODE_KEY) === 'list' ? 'list' : 'cards'; }
  catch { return 'cards'; }
})();
let awardOnly = false;
let selFilterMode = ''; // '' | 'unselected' | 'selected'
let distPanelOpen = false;

const FILTER_IDS = [
  'filter-vendor', 'filter-match', 'filter-comp', 'filter-pub-year',
  'filter-book-type', 'filter-age', 'filter-category', 'filter-policy-topic',
  'filter-purchase-category', 'filter-recommendation-source',
  'filter-min-price', 'filter-max-price', 'filter-text', 'filter-sort',
];

function parsePublishSortKey(raw) {
  if (raw === null || raw === undefined) return null;
  let s = String(raw).trim();
  if (!s) return null;
  s = s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));

  let y = null, m = 1, d = 1;
  let isRoc = false;
  let match;

  if ((match = s.match(/^(民國\s*)?(\d{2,4})\s*(?:年|[\/\-\.])\s*(\d{1,2})(?:\s*月(?:\s*(\d{1,2})\s*日?)?|\s*[\/\-\.]\s*(\d{1,2})\s*日?)?$/))) {
    isRoc = Boolean(match[1]) || match[2].length === 3;
    if (!isRoc && match[2].length !== 4) return null;
    y = parseInt(match[2], 10);
    m = parseInt(match[3], 10);
    const dayStr = match[4] || match[5];
    d = dayStr ? parseInt(dayStr, 10) : 1;
  } else if ((match = s.match(/^(民國\s*)?(\d{2,4})\s*年$/))) {
    isRoc = Boolean(match[1]) || match[2].length === 3;
    if (!isRoc && match[2].length !== 4) return null;
    y = parseInt(match[2], 10);
  } else if ((match = s.match(/^(\d{4})(\d{2})(\d{2})$/))) {
    y = parseInt(match[1], 10);
    m = parseInt(match[2], 10);
    d = parseInt(match[3], 10);
  } else if ((match = s.match(/^(\d{4})(\d{2})$/))) {
    y = parseInt(match[1], 10);
    m = parseInt(match[2], 10);
  } else if ((match = s.match(/^(\d{4})$/))) {
    y = parseInt(match[1], 10);
  } else if ((match = s.match(/^(\d{3})$/))) {
    isRoc = true;
    y = parseInt(match[1], 10);
  } else {
    return null;
  }

  if (isRoc) y += 1911;
  if (isNaN(y) || y < 1900 || y > 2100) return null;
  if (isNaN(m) || m < 1 || m > 12) return null;
  if (isNaN(d) || d < 1 || d > 31) return null;
  return y * 10000 + m * 100 + d;
}

function parsePublishYear(raw) {
  const key = parsePublishSortKey(raw);
  return key === null ? null : Math.floor(key / 10000);
}

function hasOfficialAward(b) {
  const ov = safeParseJson(b.user_overrides, {});
  const rec = String(ov.recommendation_source || b.recommendation_source || '').trim();
  const award = String(ov.award_item || b.award_item || '').trim();
  if (rec && rec !== '學校自選(請備註原因)') return true;
  if (award && award !== '自選' && award !== '學校自選(請備註原因)') return true;
  return false;
}

function filterStorageKey() {
  return `selection_filters_${pid}`;
}

function saveFilterState() {
  if (!pid) return;
  const state = {
    _awardOnly: awardOnly,
    _selFilterMode: selFilterMode,
  };
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) state[id] = el.value;
  });
  try {
    sessionStorage.setItem(filterStorageKey(), JSON.stringify(state));
  } catch {}
}

function restoreFilterState() {
  if (!pid) return;
  const saved = safeParseJson(sessionStorage.getItem(filterStorageKey()), null);
  if (!saved) return;
  FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (!el || saved[id] === undefined) return;
    if (el.tagName === 'SELECT') {
      const hasOpt = Array.from(el.options).some(o => o.value === saved[id]);
      if (hasOpt) el.value = saved[id];
    } else {
      el.value = saved[id];
    }
  });
  awardOnly = Boolean(saved._awardOnly);
  selFilterMode = (saved._selFilterMode === 'unselected' || saved._selFilterMode === 'selected')
    ? saved._selFilterMode
    : '';
}

function syncViewToggleUI() {
  const cardsBtn = document.getElementById('btn-view-cards');
  const listBtn = document.getElementById('btn-view-list');
  if (cardsBtn) cardsBtn.classList.toggle('active', viewMode === 'cards');
  if (listBtn) listBtn.classList.toggle('active', viewMode === 'list');
}

function setViewMode(mode) {
  viewMode = mode === 'list' ? 'list' : 'cards';
  try { localStorage.setItem(VIEW_MODE_KEY, viewMode); } catch {}
  syncViewToggleUI();
  renderCurrentPage();
}

function syncPresetChipsUI() {
  const matchVal = document.getElementById('filter-match').value;
  const pubYearVal = document.getElementById('filter-pub-year').value;
  const sortVal = document.getElementById('filter-sort').value;

  const isNewBooks = matchVal === 'available' && pubYearVal === '3' && sortVal === 'pub_desc';
  document.getElementById('preset-new-books').classList.toggle('active', isNewBooks);
  document.getElementById('preset-award-books').classList.toggle('active', awardOnly);
  document.getElementById('preset-unselected').classList.toggle('active', selFilterMode === 'unselected');
  document.getElementById('preset-selected').classList.toggle('active', selFilterMode === 'selected');

  const banner = document.getElementById('selected-only-banner');
  if (banner) banner.style.display = selFilterMode === 'selected' ? 'flex' : 'none';
}

function togglePreset(preset) {
  const matchEl = document.getElementById('filter-match');
  const pubEl = document.getElementById('filter-pub-year');
  const sortEl = document.getElementById('filter-sort');

  if (preset === 'new_books') {
    const active = matchEl.value === 'available' && pubEl.value === '3' && sortEl.value === 'pub_desc';
    if (active) {
      if (!awardOnly) matchEl.value = '';
      pubEl.value = '';
      sortEl.value = 'id';
    } else {
      matchEl.value = 'available';
      pubEl.value = '3';
      sortEl.value = 'pub_desc';
    }
  } else if (preset === 'award_books') {
    if (awardOnly) {
      awardOnly = false;
      const isNewBooks = matchEl.value === 'available' && pubEl.value === '3' && sortEl.value === 'pub_desc';
      if (!isNewBooks && matchEl.value === 'available') matchEl.value = '';
    } else {
      awardOnly = true;
      matchEl.value = 'available';
    }
  } else if (preset === 'unselected') {
    selFilterMode = selFilterMode === 'unselected' ? '' : 'unselected';
  } else if (preset === 'selected') {
    selFilterMode = selFilterMode === 'selected' ? '' : 'selected';
  }
  applyFilter();
}

function toggleSelectionDist() {
  distPanelOpen = !distPanelOpen;
  const panel = document.getElementById('selection-dist-panel');
  const btn = document.getElementById('btn-toggle-dist');
  if (panel) panel.style.display = distPanelOpen ? 'flex' : 'none';
  if (btn) btn.textContent = distPanelOpen ? '已選分佈 ▴' : '已選分佈 ▾';
}

function renderSelectionDistribution(items) {
  const panel = document.getElementById('selection-dist-panel');
  if (!panel) return;
  if (!Array.isArray(items) || items.length === 0) {
    panel.innerHTML = '<div style="color:#6e6e73">尚未加入任何書目，加入選書後將即時顯示適讀年齡與分類分佈。</div>';
    return;
  }

  const countBy = (field) => {
    const map = {};
    items.forEach(item => {
      const ov = safeParseJson(item.user_overrides, {});
      const raw = String(ov[field] || item[field] || '').trim();
      const label = raw || '未標示';
      const qty = Number(item.selected_quantity) || 1;
      map[label] = (map[label] || 0) + qty;
    });
    return Object.entries(map).sort((a, b) => {
      if (a[0] === '未標示') return 1;
      if (b[0] === '未標示') return -1;
      if (b[1] !== a[1]) return b[1] - a[1];
      return a[0].localeCompare(b[0], 'zh-TW');
    });
  };

  const renderGroup = (title, entries) => {
    const chips = entries.map(([label, cnt]) =>
      `<span class="dist-chip">${esc(label)} <strong>${cnt}本</strong></span>`
    ).join('');
    return `<div class="dist-group"><span class="dist-group-label">${esc(title)}</span>${chips}</div>`;
  };

  panel.innerHTML = renderGroup('適讀年齡', countBy('age_range')) + renderGroup('分類', countBy('category'));
}

function scheduleFilter() {
  clearTimeout(filterDebounceTimer);
  filterDebounceTimer = setTimeout(() => applyFilter(), 200);
}

(function bindSearchInput() {
  const input = document.getElementById('filter-text');
  if (!input) return;
  input.addEventListener('compositionstart', () => { isComposing = true; });
  input.addEventListener('compositionend', () => {
    isComposing = false;
    scheduleFilter();
  });
  input.addEventListener('input', () => {
    if (!isComposing) scheduleFilter();
  });
})();

function updateBudgetBar(summary) {
  document.getElementById('budget-count').textContent = summary.count;
  document.getElementById('budget-list').textContent = 'NT$ ' + formatCurrency(summary.total_list_price);
  document.getElementById('budget-purchase').textContent = 'NT$ ' + formatCurrency(summary.total_purchase_price);

  const wrap = document.getElementById('budget-remaining-wrap');
  const labelEl = document.getElementById('budget-remaining-label');
  const amountEl = document.getElementById('budget-remaining');
  const progWrap = document.getElementById('budget-progress-wrap');
  const progFill = document.getElementById('budget-progress-fill');
  const progText = document.getElementById('budget-progress-text');

  if (projectBudget != null && !isNaN(projectBudget)) {
    const used = projectSubtotalMode === 'quantity_times_list_price'
      ? Number(summary.total_list_price || 0)
      : Number(summary.total_purchase_price || 0);
    const diff = projectBudget - used;
    wrap.style.display = '';
    if (diff >= 0) {
      labelEl.textContent = `核定預算 ${formatCurrency(projectBudget)}｜剩餘`;
      amountEl.textContent = 'NT$ ' + formatCurrency(diff);
      amountEl.style.color = '';
    } else {
      labelEl.textContent = `核定預算 ${formatCurrency(projectBudget)}｜超支`;
      amountEl.textContent = 'NT$ ' + formatCurrency(-diff);
      amountEl.style.color = '#c0392b';
    }

    if (projectBudget > 0) {
      const pct = (used / projectBudget) * 100;
      const barWidth = Math.min(100, Math.max(0, pct));
      const stateCls = pct > 100 ? 'is-over' : (pct >= 90 ? 'is-near' : 'is-normal');
      progWrap.style.display = 'flex';
      progFill.style.width = `${barWidth.toFixed(1)}%`;
      progFill.className = `budget-progress-fill ${stateCls}`;
      progText.className = `budget-progress-text${pct > 100 ? ' is-over' : ''}`;

    } else {
      progWrap.style.display = 'none';
    }
  } else {
    wrap.style.display = 'none';
    progWrap.style.display = 'none';
  }
}

function getEffectiveMatchStatus(b) {
  return b.match_status || b.current_match_status || 'unknown';
}

function getEffectivePrice(b) {
  const pp = parseFloat(b.purchase_price);
  if (!isNaN(pp) && pp > 0) return pp;
  const lp = parseFloat(b.list_price);
  return isNaN(lp) ? null : lp;
}

function normalizeText(v) {
  return v ? String(v).toLowerCase() : '';
}

function includesKeyword(b, kw) {
  const k = normalizeText(kw);
  return [b.title, b.author, b.isbn, b.isbn_normalized, b.publisher,
          b.summary, b.category, b.book_type, b.policy_topic, b.recommendation_source]
    .some(v => normalizeText(v).includes(k));
}

function getPurchaseCategory(b) {
  const ov = safeParseJson(b.user_overrides, {});
  const elig = ov.eligibility_label || b.eligibility_label || '';
  if (elig) return elig;
  const rec = ov.recommendation_source || b.recommendation_source || '';
  if (rec === '喜閱網') return '必選';
  if (rec === '學校自選(請備註原因)') return '自選';
  if (rec) return '推薦';
  return '';
}

const COMPLETENESS_ORDER = { export_ready: 0, needs_review: 1, missing_required: 2, unknown: 3 };
const MATCH_ORDER = { available: 0, already_owned: 1, missing_isbn: 2, invalid_isbn: 3, unknown: 4 };

function compareBooks(a, b, sortMode) {
  switch (sortMode) {
    case 'pub_desc': {
      const ka = parsePublishSortKey(a.publish_date);
      const kb = parsePublishSortKey(b.publish_date);
      if (ka === null && kb === null) return a.id - b.id;
      if (ka === null) return 1;
      if (kb === null) return -1;
      return ka !== kb ? kb - ka : a.id - b.id;
    }
    case 'pub_asc': {
      const ka = parsePublishSortKey(a.publish_date);
      const kb = parsePublishSortKey(b.publish_date);
      if (ka === null && kb === null) return a.id - b.id;
      if (ka === null) return 1;
      if (kb === null) return -1;
      return ka !== kb ? ka - kb : a.id - b.id;
    }
    case 'available_first': {
      const da = MATCH_ORDER[getEffectiveMatchStatus(a)] ?? 5;
      const db = MATCH_ORDER[getEffectiveMatchStatus(b)] ?? 5;
      return da !== db ? da - db : a.id - b.id;
    }
    case 'completeness_first': {
      const da = COMPLETENESS_ORDER[a.completeness_status] ?? 4;
      const db = COMPLETENESS_ORDER[b.completeness_status] ?? 4;
      return da !== db ? da - db : a.id - b.id;
    }
    case 'price_asc': {
      const pa = getEffectivePrice(a), pb = getEffectivePrice(b);
      if (pa === null && pb === null) return a.id - b.id;
      if (pa === null) return 1;
      if (pb === null) return -1;
      return pa !== pb ? pa - pb : a.id - b.id;
    }
    case 'price_desc': {
      const pa = getEffectivePrice(a), pb = getEffectivePrice(b);
      if (pa === null && pb === null) return a.id - b.id;
      if (pa === null) return 1;
      if (pb === null) return -1;
      return pa !== pb ? pb - pa : a.id - b.id;
    }
    case 'title':
      return (a.title || '').localeCompare(b.title || '', 'zh-TW');
    default:
      return a.id - b.id;
  }
}

function applyFilter(opts = {}) {
  saveFilterState();
  syncPresetChipsUI();
  const vendorVal = document.getElementById('filter-vendor').value;
  const matchVal = document.getElementById('filter-match').value;
  const comp = document.getElementById('filter-comp').value;
  const pubYearRange = document.getElementById('filter-pub-year').value;
  const bookType = document.getElementById('filter-book-type').value;
  const ageRange = document.getElementById('filter-age').value;
  const category = document.getElementById('filter-category').value;
  const policyTopic = document.getElementById('filter-policy-topic').value;
  const purchaseCat = document.getElementById('filter-purchase-category').value;
  const recommendationSource = document.getElementById('filter-recommendation-source').value;
  const minPrice = document.getElementById('filter-min-price').value;
  const maxPrice = document.getElementById('filter-max-price').value;
  const text = document.getElementById('filter-text').value.trim();
  const sortMode = document.getElementById('filter-sort').value;

  let filtered = allBooks;
  if (vendorVal) filtered = filtered.filter(b => (b.vendor_name || '未指定書商') === vendorVal);
  if (matchVal === 'same_title_different_isbn') {
    filtered = filtered.filter(b => Boolean(b.similar_holding));
  } else if (matchVal === 'other_project_selected') {
    filtered = filtered.filter(b => Array.isArray(b.other_project_selections) && b.other_project_selections.length > 0);
  } else if (matchVal) {
    filtered = filtered.filter(b => getEffectiveMatchStatus(b) === matchVal);
  }
  if (comp) filtered = filtered.filter(b => b.completeness_status === comp);
  if (pubYearRange) {
    const span = parseInt(pubYearRange, 10);
    if (!isNaN(span) && span > 0) {
      const minYear = new Date().getFullYear() - (span - 1);
      filtered = filtered.filter(b => {
        const y = parsePublishYear(b.publish_date);
        return y !== null && y >= minYear;
      });
    }
  }
  if (awardOnly) filtered = filtered.filter(b => hasOfficialAward(b));
  if (selFilterMode === 'unselected') {
    filtered = filtered.filter(b => !selMap[b.id]);
  } else if (selFilterMode === 'selected') {
    filtered = filtered.filter(b => (selMap[b.id] || 0) > 0);
  }
  if (bookType) filtered = filtered.filter(b => (b.book_type || '') === bookType);
  if (ageRange) filtered = filtered.filter(b => (b.age_range || '') === ageRange);
  if (category) filtered = filtered.filter(b => (b.category || '') === category);
  if (policyTopic) filtered = filtered.filter(b => (b.policy_topic || '') === policyTopic);
  if (purchaseCat) filtered = filtered.filter(b => getPurchaseCategory(b) === purchaseCat);
  if (recommendationSource) filtered = filtered.filter(b => (b.recommendation_source || '') === recommendationSource);
  if (minPrice !== '') {
    const min = parseFloat(minPrice);
    if (!isNaN(min)) filtered = filtered.filter(b => { const p = getEffectivePrice(b); return p !== null && p >= min; });
  }
  if (maxPrice !== '') {
    const max = parseFloat(maxPrice);
    if (!isNaN(max)) filtered = filtered.filter(b => { const p = getEffectivePrice(b); return p !== null && p <= max; });
  }
  if (text) filtered = filtered.filter(b => includesKeyword(b, text));

  filtered = [...filtered].sort((a, b) => compareBooks(a, b, sortMode));
  filteredBooks = filtered;
  const totalPages = Math.max(1, Math.ceil(filteredBooks.length / PAGE_SIZE));
  if (typeof opts.preservePage === 'number' && opts.preservePage >= 1) {
    currentPage = Math.min(opts.preservePage, totalPages);
  } else {
    currentPage = 1;
  }
  updateResultCount();
  renderCurrentPage();
  const btnAddPage = document.getElementById('btn-add-page');
  if (btnAddPage) btnAddPage.disabled = filteredBooks.length === 0;
}

function renderCurrentPage() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, filteredBooks.length);
  render(filteredBooks.slice(start, end));
  updatePagination();
}

function updateResultCount() {
  const total = filteredBooks.length;
  if (total === 0) {
    document.getElementById('result-count').textContent = '';
    return;
  }
  const start = (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(currentPage * PAGE_SIZE, total);
  document.getElementById('result-count').textContent =
    `第 ${start}–${end} 筆 / 共 ${total} 筆`;
}

function updatePagination() {
  const total = filteredBooks.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) {
    pag.style.display = 'none';
    return;
  }
  pag.style.display = 'flex';
  document.getElementById('page-prev').disabled = currentPage <= 1;
  document.getElementById('page-next').disabled = currentPage >= totalPages;
  document.getElementById('page-info').textContent =
    `第 ${currentPage} 頁 / 共 ${totalPages} 頁`;
}

function goPage(delta) {
  const totalPages = Math.ceil(filteredBooks.length / PAGE_SIZE);
  const next = currentPage + delta;
  if (next < 1 || next > totalPages) return;
  currentPage = next;
  updateResultCount();
  renderCurrentPage();
  document.getElementById('book-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetFilters() {
  [
    'filter-vendor', 'filter-match', 'filter-comp', 'filter-pub-year',
    'filter-book-type', 'filter-age', 'filter-category', 'filter-policy-topic',
    'filter-purchase-category', 'filter-recommendation-source', 'filter-sort'
  ].forEach(id => {
    const s = document.getElementById(id);
    if (s && s.options.length > 0) s.value = s.options[0].value;
  });
  ['filter-min-price', 'filter-max-price', 'filter-text']
    .forEach(id => { document.getElementById(id).value = ''; });
  awardOnly = false;
  selFilterMode = '';
  try { sessionStorage.removeItem(filterStorageKey()); } catch {}
  applyFilter();
}

  }

}

function renderVendorCompareBox(b) {
  if (!Array.isArray(b.other_vendor_offers) || b.other_vendor_offers.length === 0) return '';
  const curPrice = getEffectivePrice(b);
  const offerLines = b.other_vendor_offers.map(o => {
    const oPrice = o.purchase_price != null ? Number(o.purchase_price)
      : (o.list_price != null ? Number(o.list_price) : null);
    const priceLabel = o.purchase_price != null
      ? `單價 NT$ ${formatCurrency(o.purchase_price)}`
      : (o.list_price != null ? `定價 NT$ ${formatCurrency(o.list_price)}` : '無價格');
    const isCheaper = curPrice !== null && oPrice !== null && oPrice < curPrice;
    const cheaperTag = isCheaper ? '<span class="vendor-compare-cheaper">較低價</span>' : '';
    return `<div>${esc(o.vendor_name || '未指定書商')}：${esc(priceLabel)}${cheaperTag}</div>`;
  }).join('');
  return `<div class="vendor-compare-box"><strong>多家供貨比價</strong>${offerLines}</div>`;
}

    const isbnText = sh.isbn ? `（ISBN: ${esc(sh.isbn)}）` : '';
    html += `<div class="dup-warn-box dup-warn-similar"><span class="badge badge-similar">疑似同名館藏</span> 館藏：${detailParts.join(' / ')}${isbnText}</div>`;
  }
  if (Array.isArray(b.other_project_selections) && b.other_project_selections.length > 0) {
    const exported = b.other_project_selections.filter(p => p.has_exported);
    const selecting = b.other_project_selections.filter(p => !p.has_exported);
    if (exported.length > 0) {

      html += `<div class="dup-warn-box dup-warn-other-project"><span class="badge badge-other-project">他案選書中</span> ${names}</div>`;

function render(books) {
  const grid = document.getElementById('book-grid');
  grid.className = viewMode === 'list' ? 'books-list-wrap' : 'books-grid';
  if (!books.length) {
    grid.innerHTML = '<div style="text-align:center;color:#999;padding:60px 0">無符合條件的書目</div>';
    return;
  }
  if (viewMode === 'list') {
    grid.innerHTML = renderListView(books);
    return;
  }
  grid.innerHTML = books.map(b => {
    const ov = safeParseJson(b.user_overrides, {});
    const title = ov.title || b.title || '—';
    const author = ov.author || b.author || '—';
    const isbn = b.isbn_normalized || b.isbn || '—';
    const lp = ov.list_price || b.list_price;
    const pp = ov.purchase_price || b.purchase_price;
    const award = ov.award_item || b.award_item || '';
    const summary = b.summary || '';
    const policyTopic = b.policy_topic || '';
    const holdingsUrl = b.isbn_normalized
      ? `/holdings.html?isbn=${encodeURIComponent(b.isbn_normalized)}`
      : `/holdings.html?q=${encodeURIComponent(b.title || '')}`;
    const ctaBtn = renderCtaButton(b, false);
    return `
    <div class="book-card">
      <div class="book-card-body">
        <div class="book-card-title">${esc(title)}</div>
        <div class="book-card-meta">${esc(author)}</div>
        <div class="book-card-isbn">ISBN: ${esc(isbn)}${b.publish_date ? `｜出版：${esc(b.publish_date)}` : ''}</div>
        <div class="book-card-price">
          <span>定價 ${lp ? formatCurrency(lp) : '—'}</span>
          <span class="purchase">採購 ${pp ? formatCurrency(pp) : '—'}</span>
        </div>
        ${award ? `<div class="book-card-award">${esc(award)}</div>` : ''}
        ${policyTopic ? `<div style="font-size:11px;margin-top:4px"><span style="background:#e8f4f8;color:#1d6fa4;border-radius:3px;padding:1px 5px">${esc(policyTopic)}</span></div>` : ''}
        ${summary ? `<div style="font-size:12px;color:#6e6e73;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(summary)}</div>` : ''}
        <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center"><span class="badge badge-vendor">${esc(b.vendor_name || '未指定書商')}</span>${renderMatchBadge(b)}${badge(b.completeness_status || 'unknown')}</div>
        ${renderVendorCompareBox(b)}
        ${renderDuplicateWarnings(b)}
      </div>
      <div class="book-card-footer">
        <div class="book-card-links">
          <a href="#" onclick="toggleEdit(${b.id}); return false;">修正資料</a>
          <a href="${esc(holdingsUrl)}" target="_blank" rel="noopener">查館藏</a>
        </div>
        ${ctaBtn}
      </div>
      <div id="edit-${b.id}" class="book-card-edit" style="display:none">
        ${renderInlineEditForm(b)}
      </div>
    </div>`;
  }).join('');
}

async function addCurrentPage() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageBooks = filteredBooks.slice(start, start + PAGE_SIZE);
  const toAdd = pageBooks.filter(b => !selMap[b.id]);
  if (!toAdd.length) { showToast('本頁書目已全部加入清單'); return; }

  const ownedCount = toAdd.filter(
    b => getEffectiveMatchStatus(b) === 'already_owned'
  ).length;

  if (ownedCount > 0) {
    const ok = confirm(
      `本頁有 ${ownedCount} 本已館藏書目，確認仍要採購並加入選書清單嗎？`
    );
    if (!ok) return;
  }

  const btn = document.getElementById('btn-add-page');
  btn.disabled = true;
  btn.textContent = '處理中…';

  try {
    const items = toAdd.map(b => ({
      vendor_book_id: b.id,
      force_owned: getEffectiveMatchStatus(b) === 'already_owned',
    }));
    const result = await api('/api/selections/bulk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_id: pid, items }),
    });
    await refreshBudget();
    renderCurrentPage();
    showToast(`已加入 ${result.added} 本，略過 ${result.skipped} 本（已在清單）`);
  } catch (e) {
    showToast('加入失敗：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '加入本頁';
  }
}

async function addBook(bookId, btn) {
  if (selMap[bookId] > 0) return;
  const targetBtn = btn || document.getElementById('cta-' + bookId);
  if (targetBtn) targetBtn.disabled = true;
  try {
    await api('/api/selections/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project_id: pid, vendor_book_id: bookId, quantity: 1 })
    });
    await refreshBudget();
    const qty = selMap[bookId] || 1;
    if (targetBtn) {
      targetBtn.classList.add('selected');
      targetBtn.textContent = `✓ 已加入（${qty}本）`;
      targetBtn.title = LOCKED_CTA_TITLE;
      targetBtn.onclick = null;
      targetBtn.disabled = true;
    }
  } catch (e) {
    showToast('加入失敗：' + e.message);
    if (targetBtn) targetBtn.disabled = false;
  }
}

async function refreshBudget() {
  const selData = await api(`/api/selections/?project_id=${pid}`);
  currentSelectionItems = selData.items || [];
  selMap = {};
  selIdMap = {};
  currentSelectionItems.forEach(s => {
    selMap[s.id] = s.selected_quantity;
    selIdMap[s.id] = s.sel_id;
  });
  updateBudgetBar(selData.summary);
  renderSelectionDistribution(currentSelectionItems);
}

function toggleEdit(id) {
  const el = document.getElementById('edit-' + id);
  if (!el) return;
  const openVal = el.tagName === 'TR' ? 'table-row' : 'block';
  el.style.display = el.style.display === 'none' ? openVal : 'none';
}

async function saveOverrides(bookId, btn) {
  const inputs = document.querySelectorAll(`[data-bookid="${bookId}"]`);
  const overrides = {};
  inputs.forEach(inp => { overrides[inp.dataset.field] = inp.value.trim(); });
  if (btn) btn.disabled = true;
  try {
    await api(`/api/books/${bookId}/overrides?project_id=${pid}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ overrides })
    });
    const selId = selIdMap[bookId] || null;
    if (selId) {
      await api(`/api/selections/${selId}/overrides`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ overrides })
      });
    }
    showToast('修正已儲存');
    toggleEdit(bookId);
    await loadData({ preservePage: currentPage, preserveScrollY: window.scrollY });
  } catch (e) {
    showToast('儲存失敗：' + e.message);
    if (btn) btn.disabled = false;
  }
}

async function openImportProjectsModal() {
  const modal = document.getElementById('import-projects-modal');
  const listEl = document.getElementById('import-projects-list');
  const resultEl = document.getElementById('import-projects-result');
  const submitBtn = document.getElementById('btn-confirm-import-projects');
  if (!modal || !listEl) return;

  resultEl.style.display = 'none';
  resultEl.textContent = '';
  document.getElementById('import-skip-owned').checked = true;
  listEl.innerHTML = '<div style="color:#6e6e73;font-size:13px">載入專案中...</div>';
  submitBtn.disabled = true;
  modal.style.display = 'flex';

  try {
    const projects = await api('/api/projects/');
    const others = (projects || []).filter(p => p.id !== pid);
    if (!others.length) {
      listEl.innerHTML = '<div style="color:#6e6e73;font-size:13px">目前沒有其他可匯入的專案。</div>';
      return;
    }
    listEl.innerHTML = others.map(p => {
      const count = Number(p.selection_count || 0);
      const metaParts = [
        p.academic_year ? `${p.academic_year}學年度` : null,
        projectTypeLabel(p.project_type),
        `已選 ${count} 筆`,
        p.is_archived ? '已封存' : null,
      ].filter(Boolean);
      return `
        <label class="modal-project-item" style="${count === 0 ? 'opacity:0.55;cursor:not-allowed' : ''}">
          <input type="checkbox" class="import-src-project-cb" value="${p.id}" ${count === 0 ? 'disabled' : ''}>
          <div>
            <div style="font-weight:600;font-size:14px">${esc(p.name)}</div>
            <div class="modal-project-meta">${esc(metaParts.join('｜'))}</div>
          </div>
        </label>`;
    }).join('');
    submitBtn.disabled = !others.some(p => Number(p.selection_count || 0) > 0);
  } catch (e) {
    listEl.innerHTML = `<div class="alert alert-error" style="margin:0">載入專案清單失敗：${esc(e.message)}</div>`;
  }
}

function closeImportProjectsModal() {
  const modal = document.getElementById('import-projects-modal');
  if (modal) modal.style.display = 'none';
}

async function submitImportFromProjects(btn) {
  const checked = Array.from(document.querySelectorAll('.import-src-project-cb:checked'))
    .map(cb => parseInt(cb.value, 10))
    .filter(n => !isNaN(n) && n > 0);
  if (!checked.length) {
    showToast('請至少勾選一個來源專案');
    return;
  }

  const skipOwned = document.getElementById('import-skip-owned').checked;
  const resultEl = document.getElementById('import-projects-result');
  if (btn) {
    btn.disabled = true;
    btn.textContent = '匯入中…';
  }
  try {
    const res = await api('/api/selections/import-from-projects', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        target_project_id: pid,
        source_project_ids: checked,
        skip_already_owned: skipOwned,
      }),
    });
    const summaryMsg = `匯入完成：新增 ${res.added} 本、略過重複 ${res.skipped_duplicate} 本、略過已館藏 ${res.skipped_owned} 本。`;
    resultEl.textContent = summaryMsg;
    resultEl.style.display = 'block';
    showToast(summaryMsg, 3500);
    await loadData({ preservePage: currentPage });
  } catch (e) {
    showToast('匯入失敗：' + e.message);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = '開始匯入';
    }
  }
}

function renderClearedItems(items) {
  const section = document.getElementById('cleared-section');
  const grid = document.getElementById('cleared-grid');
  if (!items.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  grid.innerHTML = items.map(s => {
    const ov = safeParseJson(s.user_overrides, {});
    const isGeneral = isGeneralBooks(projectType);
    const title = ov.title || s.title || '—';
    const author = ov.author || s.author || '—';
    const isbn = s.isbn_normalized || s.isbn || '—';
    const lp = ov.list_price || s.list_price;
    const pp = ov.purchase_price || s.purchase_price;
    const award = ov.award_item || s.award_item || '';
    const summary = s.summary || '';
    const policyTopic = s.policy_topic || '';
    const curElig = ov.eligibility_label || s.eligibility_label || '';
    const curRecSrc = ov.recommendation_source || s.recommendation_source || '';
    const eligOptions = ['', '必選', '推薦', '自選'].map(v =>
      `<option value="${esc(v)}" ${curElig === v ? 'selected' : ''}>${esc(v) || '（原始）'}</option>`).join('');
    const recSrcOptions = ['', ...H_ALLOWED].map(v =>
      `<option value="${esc(v)}" ${curRecSrc === v ? 'selected' : ''}>${esc(v) || '（原始）'}</option>`).join('');
    return `
    <div class="book-card" style="border-color:#d1d1d6;opacity:0.9">
      <div class="book-card-body">
        <div style="font-size:11px;color:#6e6e73;margin-bottom:4px">保存紀錄快照</div>
        <div class="book-card-title">${esc(title)}</div>
        <div class="book-card-meta">${esc(author)}</div>
        <div class="book-card-isbn">ISBN: ${esc(isbn)}</div>
        <div class="book-card-price">
          <span>定價 ${lp ? formatCurrency(lp) : '—'}</span>
          <span class="purchase">採購 ${pp ? formatCurrency(pp) : '—'}</span>
        </div>
        ${award ? `<div class="book-card-award">${esc(award)}</div>` : ''}
        ${policyTopic ? `<div style="font-size:11px;margin-top:4px"><span style="background:#e8f4f8;color:#1d6fa4;border-radius:3px;padding:1px 5px">${esc(policyTopic)}</span></div>` : ''}
        ${summary ? `<div style="font-size:12px;color:#6e6e73;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${esc(summary)}</div>` : ''}
        <div style="margin-top:4px;font-size:12px;color:#6e6e73">數量：${s.selected_quantity}</div>
      </div>
      <div class="book-card-footer">
        <div class="book-card-links">
          <a href="#" onclick="toggleClearedEdit(${s.sel_id}); return false;">修正資料</a>
        </div>
      </div>
      <div id="cleared-edit-${s.sel_id}" class="book-card-edit" style="display:none">
        <div class="inline-edit open">
          <div class="field-row"><label>書名</label><input type="text" value="${esc(ov.title||s.title||'')}" data-field="title" data-selid="${s.sel_id}"></div>
          <div class="field-row"><label>作者</label><input type="text" value="${esc(ov.author||s.author||'')}" data-field="author" data-selid="${s.sel_id}"></div>
          <div class="field-row"><label>出版社</label><input type="text" value="${esc(ov.publisher||s.publisher||'')}" data-field="publisher" data-selid="${s.sel_id}"></div>
          ${!isGeneral ? `<div class="field-row"><label>獲獎項目</label><input type="text" value="${esc(ov.award_item||s.award_item||'')}" data-field="award_item" data-selid="${s.sel_id}"></div>` : ''}
          ${isGeneral ? `<div class="field-row"><label>必選/推薦（${projectType === 'general_books_jh' ? 'B' : 'A'}欄）</label><select data-field="eligibility_label" data-selid="${s.sel_id}">${eligOptions}</select></div>` : ''}
          ${projectType === 'general_books' ? `<div class="field-row"><label>H欄推薦來源</label><select data-field="recommendation_source" data-selid="${s.sel_id}">${recSrcOptions}</select></div>` : ''}
          ${projectType === 'general_books_jh' ? `<div class="field-row"><label>K欄獲獎項目</label><select data-field="recommendation_source" data-selid="${s.sel_id}">${recSrcOptions}</select></div>` : ''}
          ${projectType === 'general_books' ? `<div class="field-row"><label>備註（L欄）</label><input type="text" value="${esc(ov.award_notes||s.award_notes||'')}" data-field="award_notes" data-selid="${s.sel_id}"></div>` : ''}
          <div class="field-row"><label>定價</label><input type="number" value="${esc(ov.list_price||s.list_price||'')}" data-field="list_price" data-selid="${s.sel_id}"></div>
          <div class="field-row"><label>單價</label><input type="number" value="${esc(ov.purchase_price||s.purchase_price||'')}" data-field="purchase_price" data-selid="${s.sel_id}"></div>
          <button class="btn btn-primary btn-sm" onclick="saveSelectionOverrides(${s.sel_id}, this)">儲存修正</button>
          <button class="btn btn-secondary btn-sm" onclick="toggleClearedEdit(${s.sel_id})">取消</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleClearedEdit(selId) {
  const el = document.getElementById('cleared-edit-' + selId);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function saveSelectionOverrides(selId, btn) {
  const inputs = document.querySelectorAll(`[data-selid="${selId}"]`);
  const overrides = {};
  inputs.forEach(inp => { overrides[inp.dataset.field] = inp.value.trim(); });
  if (btn) btn.disabled = true;
  try {
    await api(`/api/selections/${selId}/overrides`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ overrides })
    });
    showToast('修正已儲存');
    toggleClearedEdit(selId);
    await loadData({ preservePage: currentPage, preserveScrollY: window.scrollY });
  } catch (e) {
    showToast('儲存失敗：' + e.message);
    if (btn) btn.disabled = false;
  }
}

async function clearAll(btn) {
  if (!confirm('確定清空所有選書紀錄？')) return;
  const targetBtn = btn || document.getElementById('btn-clear-all');
  if (targetBtn) targetBtn.disabled = true;
  try {
    await api(`/api/selections/?project_id=${pid}`, { method: 'DELETE' });
    selMap = {};
    selIdMap = {};
    currentSelectionItems = [];
    showToast('已清空選書');
    await loadData();
  } catch (e) {
    showToast('清空失敗：' + e.message);
  } finally {
    if (targetBtn) targetBtn.disabled = false;
  }
}
</script>
